name: CI – Sales Insight Automator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend: Lint & Build ──
  backend:
    name: Backend – Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check app/ --output-format=github

      - name: Check formatting with Ruff
        run: ruff format app/ --check

      - name: Validate imports
        run: python -c "from app.main import app; print('✓ App imports successfully')"

  # ── Frontend: Lint & Build ──
  frontend:
    name: Frontend – Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

  # ── Docker: Validate Build ──
  docker:
    name: Docker – Validate Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for build
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=test-key
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=test@example.com
          SMTP_PASSWORD=test-password
          SMTP_FROM_EMAIL=test@example.com
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Verify images created
        run: |
          docker images | grep sia
